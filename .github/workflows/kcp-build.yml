name: build kcp

on:
  workflow_dispatch:
    inputs:
      localversion:
        description: "sufixo da versão (CONFIG_LOCALVERSION)"
        default: "-kcp1"
  push:
    tags:
      - "v5.4.302-kcp*"

env:
  ARCH: arm64
  DEFCONFIG: vendor/holi-qgki_defconfig
  ANYKERNEL_REPO: https://github.com/samw662/AnyKernel3
  ANYKERNEL_BRANCH: bangkk

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio kmod zip python3 \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            clang-14 lld-14 llvm-14

      - name: toolchain
        run: |
          # o build.config.common do repo usa o clang-r416183b (AOSP). se quiser
          # o mesmo, defina a variável CLANG_URL (tar.gz com bin/clang na raiz).
          if [ -n "${{ vars.CLANG_URL }}" ]; then
            mkdir -p "$HOME/clang"
            curl -fsSL "${{ vars.CLANG_URL }}" | tar -xz -C "$HOME/clang"
            echo "$HOME/clang/bin" >> "$GITHUB_PATH"
          else
            echo "/usr/lib/llvm-14/bin" >> "$GITHUB_PATH"
          fi

      - name: variáveis de build
        run: |
          LV="${{ inputs.localversion || '-kcp1' }}"
          echo "LV=$LV" >> "$GITHUB_ENV"
          echo "MAKE_ARGS=O=out ARCH=arm64 LLVM=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_COMPAT=arm-linux-gnueabi- CROSS_COMPILE_ARM32=arm-linux-gnueabi-" >> "$GITHUB_ENV"

      - name: defconfig + localversion
        run: |
          clang --version | head -1
          touch .scmversion   # impede sufixo -dirty / hash do git
          make $MAKE_ARGS $DEFCONFIG
          scripts/config --file out/.config --set-str LOCALVERSION "$LV" -d LOCALVERSION_AUTO
          make $MAKE_ARGS olddefconfig

      - name: confere a versão
        run: |
          BASE="$(make -s kernelversion)"
          KREL="$(make -s $MAKE_ARGS kernelrelease)"
          echo "kernelversion=$BASE  kernelrelease=$KREL"
          if [ "$KREL" != "${BASE}${LV}" ]; then
            echo "::error::kernelrelease ($KREL) diferente do esperado (${BASE}${LV})"
            exit 1
          fi
          echo "KREL=$KREL" >> "$GITHUB_ENV"

      - name: compila kernel, dtbs e módulos
        run: make -j"$(nproc)" $MAKE_ARGS Image dtbs modules

      - name: instala módulos
        run: |
          make $MAKE_ARGS INSTALL_MOD_PATH="$PWD/modules_out" INSTALL_MOD_STRIP=1 modules_install
          find modules_out -name '*.ko' | wc -l

      - name: valida vermagic dos módulos
        run: |
          EXPECT="$(cat out/include/config/kernel.release)"
          bad=0; total=0
          while IFS= read -r ko; do
            total=$((total+1))
            vm="$(modinfo -F vermagic "$ko")"
            case "$vm" in
              "$EXPECT "*) ;;
              *) echo "vermagic errado: $ko -> $vm"; bad=$((bad+1)) ;;
            esac
          done < <(find modules_out -name '*.ko')
          echo "módulos: $total, errados: $bad (esperado: $EXPECT ...)"
          [ "$total" -gt 0 ] && [ "$bad" -eq 0 ]

      - name: empacota com anykernel3
        run: |
          git clone --depth 1 -b "$ANYKERNEL_BRANCH" "$ANYKERNEL_REPO" ak3
          cp out/arch/arm64/boot/Image ak3/Image

          # dtbs: concatena os .dtb gerados (filtre pro seu aparelho se precisar)
          find out/arch/arm64/boot/dts/vendor/qcom -name '*.dtb' | sort | xargs -r cat > ak3/dtb

          # módulos: usa o place-modules.sh do próprio AnyKernel3 (branch bangkk)
          cd ak3
          chmod +x place-modules.sh
          ./place-modules.sh "../modules_out/lib/modules/$KREL" modules/vendor/lib/modules /vendor/lib/modules

          ZIP="KCP-${KREL}-$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP" . -x '.git*' 'README.md' '*placeholder'
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: artefatos
        uses: actions/upload-artifact@v4
        with:
          name: kcp-${{ env.KREL }}
          path: |
            ${{ env.ZIP }}
            out/arch/arm64/boot/Image
            out/.config
          if-no-files-found: error

      - name: módulos (tar)
        run: tar -C modules_out -czf "modules-${KREL}.tar.gz" lib

      - name: artefato dos módulos
        uses: actions/upload-artifact@v4
        with:
          name: kcp-modules-${{ env.KREL }}
          path: modules-${{ env.KREL }}.tar.gz
