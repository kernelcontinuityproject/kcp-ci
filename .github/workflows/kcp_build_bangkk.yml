
name: Build KCP kernel for motorola moto g84 5G

on:
  workflow_dispatch:
    inputs:
      localversion:
        description: "Version suffix (CONFIG_LOCALVERSION)"
        default: "-moto-kcp1"
        type: string
  push:
    tags:
      - "v5.4.302-moto-kcp*"

permissions:
  contents: read

env:
  ARCH: arm64
  DEFCONFIG: vendor/holi-qgki_defconfig

  KERNEL_REPO: kernelcontinuityproject/android_kernel_motorola_sm6375-kcp
  KERNEL_BRANCH: lineage-24.0

  CLANG_REPO: https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b
  CLANG_BRANCH: lineage-20.0

  ANYKERNEL_REPO: https://github.com/samw662/AnyKernel3
  ANYKERNEL_BRANCH: bangkk

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ github.event_name == 'push' && github.ref_name || env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: Check kernel tree
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f Makefile ] || ! grep -q '^SUBLEVEL = 302' Makefile; then
            echo "::error::This is not the 5.4.302 kernel tree"
            exit 1
          fi

          test -f "arch/arm64/configs/$DEFCONFIG"

      - name: Install dependencies
        shell: bash
        run: |
          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            cpio kmod zip unzip python3 gcc-aarch64-linux-gnu \
            binutils file rsync lz4 zstd device-tree-compiler

      - name: Set up AOSP clang
        shell: bash
        run: |
          set -euo pipefail

          git clone --depth 1 \
            -b "$CLANG_BRANCH" \
            "$CLANG_REPO" \
            "$HOME/clang"

          rm -rf "$HOME/clang/.git"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Set build variables
        shell: bash
        run: |
          set -euo pipefail

          LV="${{ inputs.localversion || '-moto-kcp1' }}"

          echo "LV=$LV" >> "$GITHUB_ENV"
          echo "MAKE_ARGS=O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail

          clang --version | head -1
          touch .scmversion

          make $MAKE_ARGS "$DEFCONFIG"

          scripts/config --file out/.config \
            --set-str LOCALVERSION "$LV"

          scripts/config --file out/.config \
            --disable LOCALVERSION_AUTO

          # Motorola DT overlays
          scripts/config --file out/.config \
            --enable BUILD_ARM64_DT_OVERLAY

          # Moto G84 device tree
          scripts/config --file out/.config \
            --enable BANGKK_DTB

          make $MAKE_ARGS olddefconfig
          make $MAKE_ARGS syncconfig

          # Verify LLVM
          grep -q '^CONFIG_CC_IS_CLANG=y' out/.config
          grep -q '^CONFIG_LD_IS_LLD=y' out/.config

          # Verify DT configuration
          grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y' out/.config || {
            echo "::error::BUILD_ARM64_DT_OVERLAY is not enabled"
            exit 1
          }

          grep -q '^CONFIG_BANGKK_DTB=y' out/.config || {
            echo "::error::BANGKK_DTB is not enabled"
            exit 1
          }

          echo "Kernel configuration validated successfully!"

      - name: Check kernel release
        shell: bash
        run: |
          set -euo pipefail

          BASE="$(make -s kernelversion)"
          KREL="$(make -s $MAKE_ARGS kernelrelease)"

          echo "kernelversion=$BASE"
          echo "kernelrelease=$KREL"

          if [ "$KREL" != "${BASE}${LV}" ]; then
            echo "::error::Unexpected kernel release: $KREL"
            exit 1
          fi

          echo "KREL=$KREL" >> "$GITHUB_ENV"

      - name: Build kernel, DTBs and modules
        shell: bash
        run: |
          set -euo pipefail

          make -j"$(nproc)" $MAKE_ARGS \
            Image dtbs modules 2>&1 | tee build.log

      - name: Diagnose generated device trees
        if: always()
        shell: bash
        run: |
          echo "===== DT CONFIG ====="
          grep -E '^CONFIG_(MMI_DEVICE_DTBS|ARCH_BLAIR|BANGKK_DTB|BUILD_ARM64_DT_OVERLAY)=' out/.config || true

          echo ""
          echo "===== GENERATED DTB FILES ====="
          find out/arch/arm64/boot/dts \
            -type f -name '*.dtb' -print 2>/dev/null | sort || true

          echo ""
          echo "===== GENERATED DTBO FILES ====="
          find out/arch/arm64/boot/dts \
            -type f -name '*.dtbo' -print 2>/dev/null | sort || true

          echo ""
          echo "===== EXPECTED MOTO G84 FILES ====="
          find out/arch/arm64/boot/dts \
            -type f \( \
              -name 'blair-moto-bangkk-base.dtb' \
              -o -name 'blair-bangkk-evb1-overlay.dtbo' \
            \) -print 2>/dev/null || true

      - name: Install modules
        shell: bash
        run: |
          set -euo pipefail

          rm -rf modules_out

          make $MAKE_ARGS \
            INSTALL_MOD_PATH="$PWD/modules_out" \
            modules_install

          MODULE_COUNT="$(find modules_out -type f -name '*.ko' | wc -l)"

          echo "Installed modules: $MODULE_COUNT"

          if [ "$MODULE_COUNT" -eq 0 ]; then
            echo "::error::No kernel modules were installed"
            exit 1
          fi

      - name: Verify module vermagic
        shell: bash
        run: |
          set -euo pipefail

          EXPECT="$(cat out/include/config/kernel.release)"

          BAD=0
          TOTAL=0

          echo "Expected vermagic: $EXPECT"

          while IFS= read -r -d '' KO; do
            TOTAL=$((TOTAL + 1))

            VM="$(
              readelf -p .modinfo "$KO" 2>/dev/null |
              sed -n 's/.*vermagic=//p' |
              head -n 1 |
              sed 's/[[:space:]]*$//'
            )"

            case "$VM" in
              "$EXPECT" | "$EXPECT "*)
                ;;
              *)
                echo "wrong vermagic: $KO -> $VM"
                BAD=$((BAD + 1))
                ;;
            esac

          done < <(find modules_out -type f -name '*.ko' -print0)

          echo "modules: $TOTAL, wrong: $BAD (expected: $EXPECT ...)"

          if [ "$TOTAL" -eq 0 ] || [ "$BAD" -ne 0 ]; then
            echo "::error::Module vermagic validation failed"
            exit 1
          fi

          echo "All modules have valid vermagic!"

      - name: Archive modules
        if: always()
        shell: bash
        run: |
          set -euo pipefail

          if [ -d modules_out/lib ]; then
            tar -C modules_out \
              -czf "modules-${KREL}.tar.gz" lib
          else
            echo "::warning::modules_out/lib does not exist"
          fi

      - name: Upload modules
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcp-modules-${{ env.KREL }}
          path: modules-${{ env.KREL }}.tar.gz
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kcp-build-diagnostics
          path: |
            build.log
            out/.config
            out/include/config/kernel.release
            out/arch/arm64/boot/dts/**/*.dtb
            out/arch/arm64/boot/dts/**/*.dtbo
          if-no-files-found: ignore
          retention-days: 7

      - name: Package with AnyKernel3
        shell: bash
        run: |
          set -euo pipefail

          IMAGE="out/arch/arm64/boot/Image"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::Kernel Image not found"
            exit 1
          fi

          # Require the expected Moto G84 base DTB.
          DTB="$(find out/arch/arm64/boot/dts \
            -type f -name 'blair-moto-bangkk-base.dtb' \
            -print -quit)"

          if [ -z "$DTB" ]; then
            echo "::error::Moto G84 base DTB was not generated"
            exit 1
          fi

          echo "Using DTB: $DTB"

          git clone --depth 1 \
            -b "$ANYKERNEL_BRANCH" \
            "$ANYKERNEL_REPO" ak3

          cp "$IMAGE" ak3/Image

          # Preserve the base DTB separately for inspection.
          cp "$DTB" ak3/

          # Do not concatenate every DTB or DTBO blindly.
          # AnyKernel3 installation format must be confirmed first.

          cd ak3

          if [ ! -f place-modules.sh ]; then
            echo "::error::place-modules.sh not found"
            exit 1
          fi

          chmod +x place-modules.sh

          ./place-modules.sh \
            "../modules_out/lib/modules/$KREL" \
            modules/vendor/lib/modules \
            /vendor/lib/modules

          ZIP="KCP-${KREL}-$(date +%Y%m%d).zip"

          zip -r9 "../$ZIP" . \
            -x '.git*' \
            'README.md' \
            '*placeholder'

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: kcp-${{ env.KREL }}
          path: ${{ env.ZIP }}
          if-no-files-found: error
          retention-days: 14
          
