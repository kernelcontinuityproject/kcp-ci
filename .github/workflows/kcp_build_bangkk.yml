name: Build KCP kernel for motorola moto g84 5G

on:
  workflow_dispatch:
    inputs:
      localversion:
        description: "Version suffix (CONFIG_LOCALVERSION)"
        default: "-moto-kcp1"
  push:
    tags:
      - "v5.4.302-moto-kcp*"

env:
  ARCH: arm64
  DEFCONFIG: vendor/holi-qgki_defconfig
  KERNEL_REPO: kernelcontinuityproject/android_kernel_motorola_sm6375-kcp
  KERNEL_BRANCH: lineage-24.0
  # AOSP kernel clang (r416183b, the one build.config.common pins), as shipped by LineageOS
  CLANG_REPO: https://github.com/LineageOS/android_prebuilts_clang_kernel_linux-x86_clang-r416183b
  CLANG_BRANCH: lineage-20.0
  ANYKERNEL_REPO: https://github.com/samw662/AnyKernel3
  ANYKERNEL_BRANCH: bangkk

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.KERNEL_REPO }}
          ref: ${{ github.event_name == 'push' && github.ref_name || env.KERNEL_BRANCH }}
          fetch-depth: 1

      - name: Check kernel tree
        run: |
          if [ ! -f Makefile ] || ! grep -q '^SUBLEVEL = 302' Makefile; then
            echo "::error::this is not the 5.4.302 kernel tree"
            ls -la
            exit 1
          fi
          test -f "arch/arm64/configs/$DEFCONFIG"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison flex libssl-dev libelf-dev cpio kmod zip python3 \
            gcc-aarch64-linux-gnu

      - name: Set up AOSP clang
        run: |
          git clone --depth 1 -b "$CLANG_BRANCH" "$CLANG_REPO" "$HOME/clang"
          rm -rf "$HOME/clang/.git"
          echo "$HOME/clang/bin" >> "$GITHUB_PATH"

      - name: Set build variables
        run: |
          LV="${{ inputs.localversion || '-moto-kcp1' }}"
          echo "LV=$LV" >> "$GITHUB_ENV"
          echo "MAKE_ARGS=O=out ARCH=arm64 LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"


      - name: Configure (defconfig + localversion)
        run: |
          clang --version | head -1
          touch .scmversion
          make $MAKE_ARGS $DEFCONFIG

          # Set kernel localversion
          scripts/config --file out/.config --set-str LOCALVERSION "$LV"
          scripts/config --file out/.config --disable LOCALVERSION_AUTO

          # Enable Motorola device tree overlays
          scripts/config --file out/.config --enable BUILD_ARM64_DT_OVERLAY

          # Apply configuration changes
          make $MAKE_ARGS olddefconfig
          make $MAKE_ARGS syncconfig

          # Verify LLVM toolchain
          grep -q '^CONFIG_CC_IS_CLANG=y' out/.config
          grep -q '^CONFIG_LD_IS_LLD=y' out/.config

          # Verify device tree overlays
          grep -q '^CONFIG_BUILD_ARM64_DT_OVERLAY=y' out/.config || {
            echo "::error::CONFIG_BUILD_ARM64_DT_OVERLAY is not enabled"
            exit 1
          }

          echo "Kernel configuration validated successfully!"
          
      - name: Check kernel release
        run: |
          BASE="$(make -s kernelversion)"
          KREL="$(make -s $MAKE_ARGS kernelrelease)"
          echo "kernelversion=$BASE  kernelrelease=$KREL"
          if [ "$KREL" != "${BASE}${LV}" ]; then
            echo "::error::kernelrelease ($KREL) does not match expected (${BASE}${LV})"
            exit 1
          fi
          echo "KREL=$KREL" >> "$GITHUB_ENV"

      - name: Build kernel, dtbs and modules
        run: make -j"$(nproc)" $MAKE_ARGS Image dtbs modules

      - name: Install modules
        run: |
          make $MAKE_ARGS INSTALL_MOD_PATH="$PWD/modules_out" INSTALL_MOD_STRIP=1 modules_install
          find modules_out -name '*.ko' | wc -l


      - name: Diagnose module vermagic
        run: |
          echo "Expected vermagic:"
          cat out/include/config/kernel.release

          for f in \
            modules_out/lib/modules/*/kernel/lib/lzo/lzo_decompress.ko \
            modules_out/lib/modules/*/kernel/lib/lzo/lzo_compress.ko \
            modules_out/lib/modules/*/kernel/crypto/lzo.ko \
            modules_out/lib/modules/*/kernel/crypto/lzo-rle.ko
          do
            echo ""
            echo "===== $f ====="
            ls -l "$f"
            file "$f"
            modinfo -F vermagic "$f" || true
            readelf -S "$f" | grep -E 'modinfo|this_module'
            readelf -p .modinfo "$f" || true
          done
          
      - name: Verify module vermagic
        run: |
          EXPECT="$(cat out/include/config/kernel.release)"
          bad=0; total=0
          while IFS= read -r ko; do
            total=$((total+1))
            vm="$(modinfo -F vermagic "$ko")"
            case "$vm" in
              "$EXPECT "*) ;;
              *) echo "wrong vermagic: $ko -> $vm"; bad=$((bad+1)) ;;
            esac
          done < <(find modules_out -name '*.ko')
          echo "modules: $total, wrong: $bad (expected: $EXPECT ...)"
          [ "$total" -gt 0 ] && [ "$bad" -eq 0 ]

      - name: Package with AnyKernel3
        run: |
          git clone --depth 1 -b "$ANYKERNEL_BRANCH" "$ANYKERNEL_REPO" ak3
          cp out/arch/arm64/boot/Image ak3/Image

          # dtbs: concatenate the generated .dtb files (filter for the device if needed)
          find out/arch/arm64/boot/dts/vendor/qcom -name '*.dtb' | sort | xargs -r cat > ak3/dtb

          # modules: use the AnyKernel3 branch's own place-modules.sh
          cd ak3
          chmod +x place-modules.sh
          ./place-modules.sh "../modules_out/lib/modules/$KREL" modules/vendor/lib/modules /vendor/lib/modules

          ZIP="KCP-${KREL}-$(date +%Y%m%d).zip"
          zip -r9 "../$ZIP" . -x '.git*' 'README.md' '*placeholder'
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - name: Upload flashable zip
        uses: actions/upload-artifact@v4
        with:
          name: kcp-${{ env.KREL }}
          path: |
            ${{ env.ZIP }}
            out/arch/arm64/boot/Image
            out/.config
          if-no-files-found: error

      - name: Pack modules
        run: tar -C modules_out -czf "modules-${KREL}.tar.gz" lib

      - name: Upload modules
        uses: actions/upload-artifact@v4
        with:
          name: kcp-modules-${{ env.KREL }}
          path: modules-${{ env.KREL }}.tar.gz
